services:
  server:
    build: ./server
    container_name: paidan-server
    environment:
      PAIDAN_JWT_SECRET: ${PAIDAN_JWT_SECRET:?请先在 .env 里设置 PAIDAN_JWT_SECRET}
      PAIDAN_DB_PATH: /data/paidan.db
      PAIDAN_DEFAULT_PASSWORD: ${PAIDAN_DEFAULT_PASSWORD:-123456}
      TZ: Asia/Shanghai
    volumes:
      - ./deploy-data:/data
    restart: unless-stopped

  web:
    build: ./admin
    container_name: paidan-web
    ports:
      - "${PAIDAN_PORT:-8080}:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
